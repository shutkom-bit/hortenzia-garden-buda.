<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hortenzia Garden Buda: igényesen berendezett, 77 m²-es, 3 szobás kertes lakás kiadó Újbudán (Budapest XI.), 11 m²-es terasszal és közel 500 m²-es saját kerttel.">
<title>Hortenzia Garden Buda, kiadó kertes lakás Újbudán (Budapest XI.)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F1EE; --ink:#1E2621; --muted:#58615B; --green:#2F4A3C; --on-green:#F1F1EE; --gold:#9A7533; --line:#D4D5CE; --soft:#E6E7E1;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151916; --ink:#E9E8E2; --muted:#A8AFA9; --green:#9DBFA9; --on-green:#151916; --gold:#CDA65C; --line:#2D332F; --soft:#1E2420; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#151916; --ink:#E9E8E2; --muted:#A8AFA9; --green:#9DBFA9; --on-green:#151916; --gold:#CDA65C; --line:#2D332F; --soft:#1E2420; color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px); scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{transition:none!important}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.65 "Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif; font-weight:500; line-height:1.05; margin:0}
p{margin:0}
a{color:inherit}
img{max-width:100%; display:block}
:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px}

body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
header.top{position:fixed; top:0; left:0; right:0; z-index:9; padding-top:env(safe-area-inset-top,0px); color:#F4F3EE; background:transparent; transition:background .35s ease, color .35s ease, box-shadow .35s ease}
header.top.solid{background:var(--bg); color:var(--ink); box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex; align-items:center; gap:28px; min-height:84px; transition:min-height .35s ease}
.top.solid .wrap{min-height:68px}
.mark{display:flex; align-items:center; gap:12px; text-decoration:none; margin-right:auto}
.mark svg{width:38px; height:38px; flex:none; color:#E3C47F; transition:color .35s}
.top.solid .mark svg{color:var(--gold)}
.mark .nm{display:flex; flex-direction:column; line-height:1}
.mark .nm b{white-space:nowrap; font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; font-size:28px; letter-spacing:.01em}
.mark .nm i{font-style:normal; font-size:12px; letter-spacing:.34em; margin-top:5px; color:#E3C47F; transition:color .35s}
.top.solid .mark .nm i{color:var(--gold)}
.nav{display:flex; gap:26px; font-size:15px}
.nav a{text-decoration:none; color:inherit; opacity:.82; padding:6px 0; border-bottom:1px solid transparent; transition:opacity .2s, border-color .2s}
.nav a:hover{opacity:1; border-bottom-color:currentColor}
.langs{display:flex; gap:2px}
.langs button{font:500 14px "Jost",sans-serif; background:none; border:0; color:inherit; opacity:.7; min-width:40px; min-height:40px; cursor:pointer; border-bottom:1.5px solid transparent}
.langs button[aria-pressed="true"]{opacity:1; border-bottom-color:#E3C47F}
.top.solid .langs button[aria-pressed="true"]{border-bottom-color:var(--gold)}
.hcta{display:inline-flex; align-items:center; min-height:42px; padding:0 20px; border:1px solid currentColor; border-radius:2px; color:inherit; text-decoration:none; font:500 15px "Jost",sans-serif; transition:background .25s, color .25s, border-color .25s}
.hcta:hover{background:#F4F3EE; color:#1E2621; border-color:#F4F3EE}
.top.solid .hcta{background:var(--green); color:var(--on-green); border-color:var(--green)}
.top.solid .hcta:hover{opacity:.9}
.hero::before{content:""; position:absolute; z-index:1; inset:0 0 auto; height:230px; background:linear-gradient(to bottom, rgba(10,16,12,.68), rgba(10,16,12,0)); pointer-events:none}
@media (max-width:560px){.hcta{display:none} .mark .nm b{font-size:22px} .mark svg{width:32px; height:32px}}

.hero{position:relative; height:min(88svh,880px); min-height:520px; overflow:hidden; background:var(--soft)}
.hero img{width:100%; height:100%; object-fit:cover}
.hero::after{content:""; position:absolute; inset:0; background:linear-gradient(to top, rgba(10,16,12,.82) 0%, rgba(10,16,12,.5) 35%, rgba(10,16,12,0) 62%)}
.hero .cap{position:absolute; z-index:1; left:0; right:0; bottom:0; color:#F4F3EE; padding-bottom:48px}
.hero .where{font-size:15px; letter-spacing:.04em; opacity:.9}
.hero h1{font-size:clamp(40px,6vw,80px); max-width:12em; margin-top:10px}
.hero .price{margin-top:18px; font-size:19px}
.hero .price b{font-weight:500}

.lede{padding:96px 0 88px}
.lede .wrap{display:grid; grid-template-columns:1.35fr 1fr; gap:72px; align-items:start}
.lede p{font-family:"Cormorant Garamond",Georgia,serif; font-size:clamp(26px,2.6vw,34px); line-height:1.3}
.facts{margin:0; border-top:1px solid var(--ink)}
.facts div{display:flex; justify-content:space-between; gap:16px; padding:13px 0; border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted)} .facts dd{margin:0; text-align:right}
.btn{display:inline-flex; align-items:center; justify-content:center; min-height:50px; padding:0 28px; border:0; border-radius:2px; background:var(--green); color:var(--on-green); font:500 16px "Jost",sans-serif; text-decoration:none; cursor:pointer}
.btn.line{background:transparent; color:var(--ink); border:1px solid var(--ink)}
.facts + .btn{margin-top:28px}

.chapter{padding:56px 0 96px}
.chapter .wrap{display:grid; grid-template-columns:repeat(12,1fr); gap:24px; align-items:end}
.chapter .big{grid-column:1 / span 7}
.chapter .txt{grid-column:9 / span 4; padding-bottom:8px}
.chapter.flip .big{grid-column:6 / span 7; grid-row:1}
.chapter.flip .txt{grid-column:1 / span 4; grid-row:1}
.chapter h2{font-size:clamp(38px,4.6vw,60px); margin-bottom:20px}
.chapter .txt p{color:var(--muted); max-width:30em}
.chapter .small{margin-top:28px}
figure{margin:0}
.ph{width:100%; object-fit:cover; background:var(--soft); cursor:zoom-in}
.big .ph{aspect-ratio:4/5}
.small .ph{aspect-ratio:4/3}
figcaption{font-size:14px; color:var(--muted); margin-top:10px}
.figbtn{padding:0; border:0; background:none; width:100%; display:block; cursor:zoom-in}

.garden{padding:0 0 96px}
.garden .wide .ph{aspect-ratio:21/9; height:auto}
.garden .grid{display:grid; grid-template-columns:repeat(12,1fr); gap:24px; margin-top:56px; align-items:start}
.garden .grid .txt{grid-column:1 / span 5}
.garden .grid .a{grid-column:7 / span 3; margin-top:40px}
.garden .grid .b{grid-column:10 / span 3}
.garden h2{font-size:clamp(38px,4.6vw,60px); margin-bottom:20px}
.garden .txt p{color:var(--muted); max-width:30em}
.garden .a .ph,.garden .b .ph{aspect-ratio:3/4}

section.block{padding:88px 0; border-top:1px solid var(--line)}
.sh{font-size:clamp(36px,4vw,52px); margin-bottom:36px}
.gtabs{display:flex; flex-wrap:wrap; gap:4px 22px; margin-bottom:28px; border-bottom:1px solid var(--line)}
.gtabs button{background:none; border:0; padding:10px 0; min-height:44px; font:400 16px "Jost",sans-serif; color:var(--muted); cursor:pointer; border-bottom:1.5px solid transparent; margin-bottom:-1px}
.gtabs button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--gold)}
.gtabs small{margin-left:5px; font-size:13px}
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.gallery button{padding:0; border:0; background:var(--soft); aspect-ratio:4/3; overflow:hidden; cursor:zoom-in}
.gallery img{width:100%; height:100%; object-fit:cover; transition:opacity .3s}
.gallery button:hover img{opacity:.85}

.cols{display:grid; grid-template-columns:repeat(3,1fr); gap:56px}
.cols h3{font-size:28px; margin-bottom:16px}
.list{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.list li{padding:11px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:16px}
.list li span:last-child{color:var(--muted); text-align:right}

.area{display:grid; grid-template-columns:1fr 2fr; gap:56px}
.area .intro p{color:var(--muted); margin-bottom:24px}
.groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:36px 40px}
.groups h3{font-size:24px; margin-bottom:10px}
.groups ul{list-style:none; margin:0; padding:0}
.groups li{padding:6px 0; color:var(--muted); border-bottom:1px solid var(--line)}

.terms{display:grid; grid-template-columns:1fr 1fr; gap:72px; align-items:start}
.terms .bigprice{font-family:"Cormorant Garamond",Georgia,serif; font-size:clamp(52px,6vw,76px); line-height:1}
.terms .per{color:var(--muted); margin-top:8px}
.terms .note{color:var(--muted); margin-top:24px; max-width:28em}

.who{display:flex; align-items:baseline; flex-wrap:wrap; gap:10px 28px; margin:-12px 0 40px; font-size:19px}
.who b{font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; font-size:30px}
.who a{text-underline-offset:4px; text-decoration-color:var(--gold)}
form{display:grid; grid-template-columns:1fr 1fr; gap:22px 24px; max-width:860px}
form .full{grid-column:1/-1}
form label{display:block; font-size:14px; color:var(--muted); margin-bottom:6px}
form input,form select,form textarea{width:100%; font:400 17px "Jost",sans-serif; color:var(--ink); background:transparent; border:0; border-bottom:1px solid var(--ink); border-radius:0; padding:10px 0; min-height:46px}
form textarea{min-height:110px; resize:vertical}
form input:focus,form select:focus,form textarea:focus{outline:none; border-bottom:2px solid var(--gold)}
form select option{color:#1E2621}
.err{color:#A3261D; font-size:14px; margin-top:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FFB4AB}}
:root[data-theme="dark"] .err{color:#FFB4AB}
.actions{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px}
.fnote{color:var(--muted); font-size:15px}

footer{padding:40px 0 56px; border-top:1px solid var(--line); color:var(--muted); font-size:14px}
footer .wrap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}

dialog.lb{border:0; padding:0; background:transparent; max-width:100vw; max-height:100vh; width:100%; height:100%}
dialog.lb::backdrop{background:rgba(10,14,11,.94)}
.lbin{position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 60px) 12px calc(env(safe-area-inset-bottom,0px) + 20px)}
.lbin img{max-width:100%; max-height:calc(100% - 60px); object-fit:contain; user-select:none}
.lbcap{color:#E9E8E2; margin-top:14px; font-size:15px; text-align:center}
.lbbtn{position:absolute; width:48px; height:48px; border-radius:50%; border:0; background:rgba(255,255,255,.12); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center}
.lbbtn:hover{background:rgba(255,255,255,.24)}
.lbclose{top:calc(env(safe-area-inset-top,0px) + 10px); right:12px}
.lbprev{left:12px; top:50%; transform:translateY(-50%)} .lbnext{right:12px; top:50%; transform:translateY(-50%)}

@media (max-width:900px){
  .nav{display:none}
  .lede{padding:64px 0}
  .lede .wrap,.terms,.area{grid-template-columns:1fr; gap:40px}
  .cols{grid-template-columns:1fr; gap:40px}
  .chapter{padding:32px 0 64px}
  .chapter .wrap,.garden .grid{grid-template-columns:1fr; gap:24px}
  .chapter .big,.chapter .txt,.chapter.flip .big,.chapter.flip .txt{grid-column:auto; grid-row:auto}
  .garden .grid .txt,.garden .grid .a,.garden .grid .b{grid-column:auto; margin-top:0}
  .big .ph{aspect-ratio:4/3}
  .garden .wide .ph{aspect-ratio:4/3}
  form{grid-template-columns:1fr}
  .hero .cap{padding-bottom:32px}
}
@media (max-width:600px){.lbprev,.lbnext{top:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 8px); transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="#top" aria-label="Hortenzia Garden Buda">
      <svg viewBox="0 0 40 40" fill="currentColor" aria-hidden="true"><circle cx="20" cy="9" r="4.3"/><circle cx="12" cy="13.5" r="4.3" opacity=".85"/><circle cx="28" cy="13.5" r="4.3" opacity=".85"/><circle cx="20" cy="18" r="4.3"/><circle cx="9.5" cy="21.5" r="4" opacity=".7"/><circle cx="30.5" cy="21.5" r="4" opacity=".7"/><circle cx="15" cy="25" r="4.2" opacity=".9"/><circle cx="25" cy="25" r="4.2" opacity=".9"/><path d="M20 29.5v8M20 34c-3-0.5-5.5-2.2-6.5-4.5M20 33c2.8-0.3 5-1.8 6-3.8" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".8"/></svg>
      <span class="nm"><b>Hortenzia Garden</b><i>BUDA</i></span>
    </a>
    <nav class="nav" aria-label="Menu">
      <a href="#photos" data-t="n_photos"></a>
      <a href="#details" data-t="n_details"></a>
      <a href="#area" data-t="n_area"></a>
      <a href="#terms" data-t="n_terms"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="hu">HU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <a class="hcta" href="#contact" data-t="h_cta"></a>
  </div>
</header>

<main id="top">
  <div class="hero">
    <img id="heroImg" alt="">
    <div class="cap"><div class="wrap">
      <p class="where" data-t="where"></p>
      <h1 data-t="hero_title"></h1>
      <p class="price"><b>540 000 Ft</b> <span data-t="per_month"></span></p>
    </div></div>
  </div>

  <section class="lede">
    <div class="wrap">
      <p data-t="lede"></p>
      <div>
        <dl class="facts" id="facts"></dl>
        <a class="btn" href="#contact" data-t="cta"></a>
      </div>
    </div>
  </section>

  <section class="chapter" data-ch="living"></section>
  <section class="chapter flip" data-ch="bedrooms"></section>
  <section class="chapter" data-ch="bath"></section>

  <section class="garden">
    <figure class="wide"><button type="button" class="figbtn" data-pic="A kert"><img class="ph" alt=""></button></figure>
    <div class="wrap grid">
      <div class="txt"><h2 data-t="g_title"></h2><p data-t="g_text"></p></div>
      <figure class="a"><button type="button" class="figbtn" data-pic="Terasz kerti bútorral"><img class="ph" alt=""></button><figcaption></figcaption></figure>
      <figure class="b"><button type="button" class="figbtn" data-pic="Rózsák a ház mentén"><img class="ph" alt=""></button><figcaption></figcaption></figure>
    </div>
  </section>

  <section class="block" id="photos">
    <div class="wrap">
      <h2 class="sh" data-t="photos_h"></h2>
      <div class="gtabs" id="gtabs" role="group"></div>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <section class="block" id="details">
    <div class="wrap">
      <h2 class="sh" data-t="details_h"></h2>
      <div class="cols">
        <div><h3 data-t="rooms_h"></h3><ul class="list" id="rooms"></ul></div>
        <div><h3 data-t="extras_h"></h3><ul class="list" id="extras"></ul></div>
        <div><h3 data-t="house_h"></h3><ul class="list" id="house"></ul></div>
      </div>
    </div>
  </section>

  <section class="block" id="area">
    <div class="wrap area">
      <div class="intro">
        <h2 class="sh" data-t="area_h"></h2>
        <p data-t="area_lead"></p>
        <a class="btn line" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Bed%C5%91%20utca%2C%20Budapest%20XI.%20ker%C3%BClet" data-t="map"></a>
      </div>
      <div class="groups" id="groups"></div>
    </div>
  </section>

  <section class="block" id="terms">
    <div class="wrap terms">
      <div>
        <h2 class="sh" data-t="terms_h"></h2>
        <p class="bigprice">540 000 Ft</p>
        <p class="per" data-t="per_month_long"></p>
        <p class="note" data-t="terms_note"></p>
      </div>
      <ul class="list" id="termsList"></ul>
    </div>
  </section>

  <section class="block" id="contact">
    <div class="wrap">
      <h2 class="sh" data-t="contact_h"></h2>
      <div class="who"><b>Julia</b><a href="https://wa.me/36207717428" target="_blank" rel="noopener">WhatsApp: +36 20 771 7428</a></div>
      <form id="form" novalidate>
        <div><label for="fname" data-t="fl_name"></label><input id="fname" autocomplete="name" required><p class="err" id="nameErr" hidden data-t="err_name"></p></div>
        <div><label for="fdate" data-t="fl_date"></label><input id="fdate" type="date"></div>
        <div><label for="fmonths" data-t="fl_months"></label><select id="fmonths"><option>12</option><option>18</option><option>24</option><option>36+</option></select></div>
        <div><label for="fpeople" data-t="fl_people"></label><select id="fpeople"><option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option></select></div>
        <div class="full"><label for="fmsg" data-t="fl_msg"></label><textarea id="fmsg"></textarea></div>
        <div class="full actions">
          <button type="button" class="btn" id="sendMail" data-t="send_mail"></button>
          <button type="button" class="btn" id="sendWa" data-t="send_wa"></button>
          <a class="btn line" id="callBtn" href="#" data-t="call" hidden></a>
        </div>
        <p class="fnote full" id="formNote"></p>
      </form>
    </div>
  </section>
</main>

<footer><div class="wrap"><span data-t="foot"></span><span>Budapest XI., Bedő utca</span></div></footer>

<dialog class="lb" id="lb">
  <div class="lbin" id="lbin">
    <img id="lbimg" alt="">
    <p class="lbcap" id="lbcap"></p>
    <button type="button" class="lbbtn lbclose" id="lbclose"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button type="button" class="lbbtn lbprev" id="lbprev"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="lbbtn lbnext" id="lbnext"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</dialog>

<script>
/* ===== Settings ===== */

let lang="hu", gcat="all", shown=[], cur=0;
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;};
const byCap=c=>PHOTOS.find(p=>p.cap.hu===c);
const cap=p=>p.cap[lang]||p.cap.hu;

function figure(p,cls){
  const f=el("figure",cls), b=el("button","figbtn"); b.type="button";
  const im=el("img","ph"); im.src=p.src; im.alt=cap(p); im.loading="lazy"; im.decoding="async";
  b.append(im); b.setAttribute("aria-label",T[lang].lb_open+" "+cap(p)); b.onclick=()=>openLb([p],0);
  f.append(b, el("figcaption",null,cap(p))); return f;
}
function rowList(id,rows){$(id).replaceChildren(...rows.map(r=>{const li=el("li"); if(Array.isArray(r)) li.append(el("span",null,r[0]),el("span",null,r[1])); else li.append(el("span",null,r)); return li;}));}

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.title=t.foot;
  document.querySelectorAll("[data-t]").forEach(n=>{const v=t[n.dataset.t]; if(typeof v==="string") n.textContent=v;});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const hp=byCap("Nappali bársony kanapéval"); const hi=$("#heroImg"); if(!hi.src) hi.src=hp.src; hi.alt=cap(hp);
  $("#facts").replaceChildren(...t.facts.map(([a,b])=>{const d=el("div"); d.append(el("dt",null,a),el("dd",null,b)); return d;}));
  document.querySelectorAll("[data-ch]").forEach(sec=>{
    const k=sec.dataset.ch, c=CHAPTERS[k], tx=t.ch[k];
    const w=el("div","wrap"), txt=el("div","txt");
    txt.append(el("h2",null,tx.t), el("p",null,tx.p), figure(byCap(c.small),"small"));
    w.append(figure(byCap(c.big),"big"), txt); sec.replaceChildren(w);
  });
  document.querySelectorAll("[data-pic]").forEach(b=>{const p=byCap(b.dataset.pic), im=b.querySelector("img");
    if(!im.src) im.src=p.src; im.alt=cap(p); b.setAttribute("aria-label",t.lb_open+" "+cap(p)); b.onclick=()=>openLb([p],0);
    const fc=b.parentElement.querySelector("figcaption"); if(fc) fc.textContent=cap(p);});

  $("#groups").replaceChildren(...Object.entries(t.cats).map(([k,v])=>{const d=el("div"); d.append(el("h3",null,v));

function renderGallery(){

  const tabs=$("#gtabs"); tabs.setAttribute("aria-label",t.photos_h);
  tabs.replaceChildren(...Object.entries(t.gcats).map(([k,v])=>{const n=k==="all"?PHOTOS.length:PHOTOS.filter(p=>p.cat===k).length; if(!n) return el("span");
    const b=el("button",null,v); b.type="button"; b.append(el("small",null,n)); b.setAttribute("aria-pressed",k===gcat); b.onclick=()=>{gcat=k; renderGallery();}; return b;}));
  const list=PHOTOS.filter(p=>gcat==="all"||p.cat===gcat);
  $("#gallery").replaceChildren(...list.map((p,i)=>{const b=el("button"); b.type="button"; b.setAttribute("aria-label",t.lb_open+" "+cap(p));
    const im=el("img"); im.src=p.src; im.alt=""; im.loading="lazy"; im.decoding="async"; b.append(im); b.onclick=()=>openLb(list,i); return b;}));
}
function showLb(){const p=shown[cur]; $("#lbimg").src=p.src; $("#lbimg").alt=cap(p); $("#lbcap").textContent=cap(p)+(shown.length>1?"  ("+(cur+1)+" / "+shown.length+")":"");
  $("#lbprev").hidden=$("#lbnext").hidden=shown.length<2;}
function openLb(list,i){shown=list; cur=i; showLb(); const d=$("#lb"); if(d.showModal) d.showModal(); else d.setAttribute("open","");}
function step(n){cur=(cur+n+shown.length)%shown.length; showLb();}
$("#lbprev").onclick=()=>step(-1); $("#lbnext").onclick=()=>step(1); $("#lbclose").onclick=()=>$("#lb").close();
$("#lb").addEventListener("click",e=>{if(e.target.id==="lbin") $("#lb").close();});
$("#lb").addEventListener("keydown",e=>{if(e.key==="ArrowLeft")step(-1); if(e.key==="ArrowRight")step(1);});
let sx=null; const lbin=$("#lbin");
lbin.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
lbin.addEventListener("touchend",e=>{if(sx===null||shown.length<2)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) step(dx<0?1:-1); sx=null;});

function data(){
  const name=$("#fname").value.trim(); $("#nameErr").hidden=!!name;
  if(!name){$("#fname").focus(); return null;}
  return {name,date:$("#fdate").value,months:$("#fmonths").value,people:$("#fpeople").value,msg:$("#fmsg").value.trim()};
}
$("#sendMail").onclick=()=>{const d=data(); if(!d)return; const t=T[lang]; if(!EMAIL){$("#formNote").textContent=t.no_contact; return;}
  window.open("mailto:"+EMAIL+"?subject="+encodeURIComponent(t.subj)+"&body="+encodeURIComponent(t.msg(d)),"_blank");};
$("#sendWa").onclick=()=>{const d=data(); if(!d)return; const t=T[lang]; if(!PHONE){$("#formNote").textContent=t.no_contact; return;}
  window.open("https://wa.me/"+PHONE.replace(/\D/g,"")+"?text="+encodeURIComponent(t.msg(d)),"_blank");};
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang; try{localStorage.setItem("lang",lang)}catch(e){} render();});
const hdr=document.querySelector("header.top"), heroEl=document.querySelector(".hero");
function hdrState(){hdr.classList.toggle("solid", window.scrollY > heroEl.offsetHeight - 120);}
window.addEventListener("scroll",hdrState,{passive:true}); window.addEventListener("resize",hdrState); hdrState();
try{const s=localStorage.getItem("lang"); if(s&&T[s]) lang=s;}catch(e){}
render();
</script>
</body>
</html>
